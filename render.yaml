services:
  - type: web
    name: charterseek
    runtime: static
    buildCommand: bash scripts/build_site.sh
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
